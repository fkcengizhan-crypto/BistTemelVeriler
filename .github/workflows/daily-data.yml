name: Günlük BIST Veri Arşivi

on:
  schedule:
    # Her iş günü 18:30 TRT (UTC+3) => 15:30 UTC, Pazartesi-Cuma
    - cron: "30 15 * * 1-5"
  # Elle de çalıştırabilmek için (Actions sekmesi -> Run workflow)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: BIST verisini çek (3 deneme)
        run: |
          for i in 1 2 3; do
            if python vericekme.py; then
              echo "Veri çekme başarılı (deneme $i)."
              exit 0
            fi
            echo "Deneme $i başarısız, 30 sn sonra tekrar denenecek..."
            sleep 30
          done
          echo "HATA: Veri çekme 3 denemede de başarısız oldu." >&2
          exit 1

      - name: Arşiv dosyalarını commit'le ve gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Archive
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "Günlük veri arşivi: $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Özet
        if: always()
        run: |
          echo "### Günlük BIST Veri Arşivi" >> "$GITHUB_STEP_SUMMARY"
          if [ -d Archive ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Son arşiv dosyaları:" >> "$GITHUB_STEP_SUMMARY"
            ls -lh Archive | tail -n 5 >> "$GITHUB_STEP_SUMMARY"
          fi
